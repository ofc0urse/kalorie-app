# Cloudflare Worker – backend AI aplikacji Kalorie (Gemini API z Google AI Studio).
# Klucz Gemini ustawiasz jako SECRET (nigdy w tym pliku!):
#   npx wrangler secret put GEMINI_API_KEY
name = "kalorie-ai"
main = "src/index.ts"
compatibility_date = "2026-09-01"

[vars]
# Dozwolone strony (CORS), oddzielone przecinkami. Localhost jest dozwolony zawsze (do testów).
# Zmień "ofc0urse" na swoją nazwę użytkownika GitHub, jeśli robisz fork.
ALLOWED_ORIGINS = "https://ofc0urse.github.io"
# Domyślny model: szybki i tani Gemini Flash-Lite (obsługuje obrazy)
MODEL_FAST = "gemini-3.5-flash-lite"
# Model dla opcji „Dokładniej” w Ustawieniach aplikacji
MODEL_ACCURATE = "gemini-3.8-flash"

# Limit zapytań na adres IP: 10 na minutę (wbudowany limiter Cloudflare).
[[ratelimits]]
name = "RATE_LIMITER"
namespace_id = "1001"

  [ratelimits.simple]
  limit = 10
  period = 60
